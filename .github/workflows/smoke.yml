# Runs the headless browser smoke test (tools/smoke.mjs) on every pull request and on pushes to main.
# Actions are pinned to commit SHAs; the comment shows the release each SHA belongs to.
name: Smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run smoke test
        run: node tools/smoke.mjs index.html
